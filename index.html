<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOYOMI — an anime almanac</title>
<meta name="description" content="Browse, search, and track what's airing this season.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="wordmark">KOYOMI<span class="dot">.</span></div>
  <form class="searchbox" id="searchForm">
    <input type="text" id="searchInput" placeholder="Search a title…" autocomplete="off">
    <button type="submit" aria-label="Search">→</button>
  </form>
</header>

<main>

  <section class="hero" id="hero">
    <div class="hero-skeleton"></div>
  </section>

  <section class="row" id="searchResults" hidden>
    <h2>Results for <span id="searchTermLabel"></span></h2>
    <div class="grid" id="searchGrid"></div>
  </section>

  <section class="row" id="seasonRow">
    <h2>Airing this season</h2>
    <div class="grid" id="seasonGrid"></div>
  </section>

  <section class="row" id="topRow">
    <h2>Highest rated, all time</h2>
    <div class="grid" id="topGrid"></div>
  </section>

</main>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<footer>
  <p>Listings and cover art via the <a href="https://jikan.moe" target="_blank" rel="noopener">Jikan API</a>, an unofficial MyAnimeList API. KOYOMI indexes nothing itself — every title links back to MyAnimeList.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
